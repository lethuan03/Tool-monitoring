# App dùng để CHẠY THỬ CHỨC NĂNG (workflow .github/workflows/ai-test.yml, hoặc chạy local).
# Khác docker-compose.app.yml: build từ source, mật khẩu GIẢ, mạng và project riêng, không đặt container_name,
# không dùng network "ecommerce-shared" -> không đụng stack thật đang chạy trên cùng máy.
# APP_DIR = thư mục webapp/ của code cần test (mặc định: thư mục chứa file này).
#
#   docker compose -f webapp/docker-compose.test.yml up -d --build --wait
#   python ai-remediation/merge-gate/runner.py --baseline ai-remediation/merge-gate/baseline.json
#   docker compose -f webapp/docker-compose.test.yml down -v
name: shop-ai-test

services:
  db:
    build: ${APP_DIR:-.}/mysql
    environment:
      MYSQL_ROOT_PASSWORD: testrootpassword
      MYSQL_DATABASE: shop
      MYSQL_USER: shop
      MYSQL_PASSWORD: testshoppassword
      MYSQL_EXPORTER_PASSWORD: testexporterpassword
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_ROOT_PASSWORD\" mysqladmin ping -h 127.0.0.1 -uroot --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  backend:
    build: ${APP_DIR:-.}/backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "3000"
      DB_HOST: db
      DB_PORT: "3306"
      DB_USER: shop
      DB_PASSWORD: testshoppassword
      DB_NAME: shop
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: TestOnlyPassword123
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 5s

  frontend:
    build: ${APP_DIR:-.}/frontend

  nginx:
    build: ${APP_DIR:-.}/nginx
    environment:
      MONITORING_BASIC_AUTH_USER: monitor
      MONITORING_BASIC_AUTH_PASSWORD: testmonitorpassword
      FORCE_HTTPS: "false"
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    ports:
      - "127.0.0.1:${TEST_PORT:-18080}:80"
