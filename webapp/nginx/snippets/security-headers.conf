# Header bảo mật dùng chung cho MỌI phản hồi (kể cả Grafana/Prometheus/Alertmanager đi qua nginx).
# LƯU Ý nginx: location nào có add_header riêng thì KHÔNG kế thừa add_header của server -> phải include lại file này.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "same-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Strict-Transport-Security $hsts_header always;
