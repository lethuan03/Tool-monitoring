# Header bảo mật cho trang shop + trang admin (do mình viết): thêm CSP và chống nhúng iframe (clickjacking).
# Không áp cho Grafana/Prometheus/Alertmanager vì giao diện của chúng cần script inline (CSP này sẽ làm hỏng).
include /etc/nginx/snippets/security-headers.conf;
add_header X-Frame-Options "DENY" always;
# Script chỉ từ chính site (frontend không dùng script inline); font Google; ảnh sản phẩm từ link https bất kỳ.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
