# Edge reverse proxy: single entry point for the whole app.
# Routes API/health to the backend, everything else to the frontend.

# Don't advertise the nginx version in headers / error pages
server_tokens off;

# --- Access log dạng JSON, để Alloy/Loki parse được thành field ---
# Log mặc định của nginx là văn bản thuần ("combined"), muốn lấy ra status hay
# thời gian xử lý thì phải viết regex. Xuất JSON thì Alloy chỉ cần `stage.json`.
# escape=json: tự escape ký tự đặc biệt (user-agent có dấu ") -> JSON không vỡ.
# Dùng $uri (đường dẫn đã chuẩn hoá) chứ không dùng $request_uri để log không
# chứa query string (có thể lẫn dữ liệu nhạy cảm).
log_format json_access escape=json
  '{'
    '"time":"$time_iso8601",'
    '"remote_addr":"$remote_addr",'
    '"method":"$request_method",'
    '"path":"$uri",'
    '"status":$status,'
    '"body_bytes":$body_bytes_sent,'
    '"request_time":$request_time,'
    '"upstream_time":"$upstream_response_time",'
    '"upstream_status":"$upstream_status",'
    '"user_agent":"$http_user_agent",'
    '"referer":"$http_referer"'
  '}';

server {
    listen 80;
    server_name _;

    # Khai báo access_log TRONG server block để GHI ĐÈ access_log mặc định
    # (định dạng "main") của /etc/nginx/nginx.conf. Nếu đặt ở ngoài (http
    # context) thì nginx cộng dồn cả hai -> mỗi request bị log 2 lần, Loki
    # lưu gấp đôi và mọi phép đếm đều sai gấp 2.
    access_log /dev/stdout json_access;

    # --- DNS nội bộ của Docker ---
    # Mặc định nginx phân giải tên `backend` MỘT LẦN lúc khởi động rồi nhớ luôn
    # địa chỉ IP. Mỗi lần `docker compose up -d --build` tạo lại container
    # backend, nó nhận IP mới, nginx vẫn trỏ vào IP cũ đã chết -> toàn bộ API
    # trả 502 cho tới khi restart nginx. Đó là lỗi thật đã gặp khi triển khai.
    #
    # Cách sửa: 127.0.0.11 là DNS nội bộ của Docker; dùng BIẾN trong proxy_pass
    # buộc nginx phân giải lại tên theo từng request (cache 10s).
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    # --- API -> backend ---
    location /api/ {
        set $backend_upstream http://backend:3000;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Health check -> backend ---
    location = /health {
        set $backend_health http://backend:3000;
        proxy_pass $backend_health;
        proxy_set_header Host $host;
    }

    # --- Metrics are internal only: Prometheus scrapes backend:3000 directly ---
    location = /metrics { return 404; }

    # --- Everything else -> frontend (static) ---
    location / {
        set $frontend_upstream http://frontend:80;
        proxy_pass $frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}

# --- Internal status endpoint for nginx-prometheus-exporter ---
# Port 8081 is NOT published to the host; only containers on the Docker network reach it.
server {
    listen 8081;
    server_name _;

    location = /stub_status {
        stub_status;
        access_log off;
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
    }

    location / { return 404; }
}
