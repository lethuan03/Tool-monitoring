# Edge reverse proxy: single entry point for the whole app.
# Routes API/health/metrics to the backend, everything else to the frontend.
# backend/frontend are not published to the host; nginx reaches them over the
# internal Docker network by service name.

upstream backend_api {
    server backend:3000;
}

upstream frontend_static {
    server frontend:80;
}

server {
    listen 80;
    server_name _;

    # --- API -> backend ---
    location /api/ {
        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Monitoring endpoints -> backend ---
    location = /health  { proxy_pass http://backend_api; }
    location = /metrics { proxy_pass http://backend_api; }

    # --- Everything else -> frontend (static) ---
    location / {
        proxy_pass http://frontend_static;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}
