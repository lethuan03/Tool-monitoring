# Edge reverse proxy: single entry point for the whole app.
# Routes API/health to the backend, everything else to the frontend.
#
# ĐÂY LÀ CHẾ ĐỘ HTTP (chạy local trên máy bạn). Trên EC2 có domain thì dùng
# nginx/https.conf thay cho file này (docker-compose.https.yml tự thay). Phần
# chung của hai chế độ nằm trong nginx/snippets/. Xem README mục 7.10.

include /etc/nginx/snippets/common-http.conf;

server {
    listen 80;
    server_name _;

    # Khai báo access_log TRONG server block để GHI ĐÈ access_log mặc định
    # (định dạng "main") của /etc/nginx/nginx.conf. Nếu đặt ở ngoài (http
    # context) thì nginx cộng dồn cả hai -> mỗi request bị log 2 lần, Loki
    # lưu gấp đôi và mọi phép đếm đều sai gấp 2.
    access_log /dev/stdout json_access;

    # Đường cho Let's Encrypt (local không dùng, để sẵn cho lần xin cert đầu tiên trên EC2)
    include /etc/nginx/snippets/acme.conf;

    # API, /health, /metrics (chặn), frontend
    include /etc/nginx/snippets/app-locations.conf;
}
