# Edge reverse proxy: single entry point for the whole app.
# Routes API/health to the backend, everything else to the frontend.

# Don't advertise the nginx version in headers / error pages
server_tokens off;

upstream backend_api {
    server backend:3000;
}

upstream frontend_static {
    server frontend:80;
}

server {
    listen 80;
    server_name _;

    # --- API -> backend ---
    location /api/ {
        proxy_pass http://backend_api;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --- Health check -> backend ---
    location = /health { proxy_pass http://backend_api; }

    # --- Metrics are internal only: Prometheus scrapes backend:3000 directly ---
    location = /metrics { return 404; }

    # --- Everything else -> frontend (static) ---
    location / {
        proxy_pass http://frontend_static;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }
}

# --- Internal status endpoint for nginx-prometheus-exporter ---
# Port 8081 is NOT published to the host; only containers on the Docker network reach it.
server {
    listen 8081;
    server_name _;

    location = /stub_status {
        stub_status;
        access_log off;
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        deny all;
    }

    location / { return 404; }
}
