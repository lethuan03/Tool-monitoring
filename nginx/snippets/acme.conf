# Let's Encrypt kiểm tra "bạn có thật sự giữ domain này không" bằng cách gọi
# http://<domain>/.well-known/acme-challenge/<mã>. Certbot ghi file mã vào
# ./certbot/www, nginx trả file đó ra. Đường này PHẢI đi được bằng HTTP (cổng 80),
# kể cả khi đã bật HTTPS, vì lần gia hạn sau Let's Encrypt vẫn gọi qua HTTP.
location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
    default_type "text/plain";
    try_files $uri =404;
}
