# Các đường đi của ứng dụng (API, health, frontend). Dùng chung cho server
# HTTP (local) và server HTTPS (EC2), để sửa một chỗ là cả hai chế độ cùng đổi.
# File này được include TRONG một server block.
# --- DNS nội bộ của Docker ---
# Mặc định nginx phân giải tên `backend` MỘT LẦN lúc khởi động rồi nhớ luôn
# địa chỉ IP. Mỗi lần `docker compose up -d --build` tạo lại container
# backend, nó nhận IP mới, nginx vẫn trỏ vào IP cũ đã chết -> toàn bộ API
# trả 502 cho tới khi restart nginx. Đó là lỗi thật đã gặp khi triển khai.
#
# Cách sửa: 127.0.0.11 là DNS nội bộ của Docker; dùng BIẾN trong proxy_pass
# buộc nginx phân giải lại tên theo từng request (cache 10s).
resolver 127.0.0.11 valid=10s ipv6=off;
resolver_timeout 5s;
# --- API -> backend ---
location /api/ {
    set $backend_upstream http://backend:3000;
    proxy_pass $backend_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
# --- Health check -> backend ---
location = /health {
    set $backend_health http://backend:3000;
    proxy_pass $backend_health;
    proxy_set_header Host $host;
}
# --- Metrics are internal only: Prometheus scrapes backend:3000 directly ---
location = /metrics { return 404; }
# --- Trang quản trị: phải là admin đã đăng nhập mới tải được file ---
# auth_request: trước khi trả file, nginx âm thầm hỏi backend (/api/auth/check,
# đọc cookie sid). 204 = cho qua; 401 = chuyển sang trang đăng nhập.
# Đây là lớp chặn thứ 2: dù lọt qua đây, mọi API thêm/sửa/xoá vẫn tự kiểm tra
# quyền ở backend (requireAdmin). tools.js chỉ trang admin dùng nên chặn luôn.
location ~ ^/(admin\.html|admin\.js|admin\.css|tools\.js)$ {
    auth_request /_auth_check;
    error_page 401 = @admin_login;
    # Không cho trình duyệt cất trang admin: đăng xuất rồi bấm Back không xem lại được
    add_header Cache-Control "no-store" always;
    set $frontend_admin http://frontend:80;
    proxy_pass $frontend_admin;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
}
location @admin_login {
    # absolute_redirect off: trả "Location: /login.html" (đường dẫn tương đối).
    # Mặc định nginx tự ghép thành http://<host>:<cổng TRONG container>/login.html,
    # tức cổng 80, trong khi trình duyệt vào bằng 8080 -> bị đẩy sang trang lỗi.
    absolute_redirect off;
    return 302 /login.html;
}
# Chỉ dùng nội bộ cho auth_request ở trên, từ ngoài gọi /_auth_check sẽ ra 404
location = /_auth_check {
    internal;
    # Biến có sẵn URI đầy đủ -> nginx gọi đúng /api/auth/check (và phân giải lại tên backend)
    set $auth_upstream http://backend:3000/api/auth/check;
    proxy_pass $auth_upstream;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
# Monitoring (chỉ admin đã đăng nhập) — nginx làm trung gian, không expose Grafana/Prometheus/Alertmanager ra ngoài trực tiếp
location ^~ /admin/grafana/ {
    add_header Cache-Control "no-store" always;
    set $grafana_upstream http://ecommerce-grafana:3000;
    proxy_pass $grafana_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
location ^~ /admin/prometheus/ {
    auth_basic "Monitoring";
    auth_basic_user_file /etc/nginx/monitoring.htpasswd;
    add_header Cache-Control "no-store" always;
    set $prometheus_upstream http://ecommerce-prometheus:9090;
    rewrite ^/admin/prometheus/(.*)$ /$1 break;
    proxy_pass $prometheus_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
location ^~ /admin/alertmanager/ {
    auth_basic "Monitoring";
    auth_basic_user_file /etc/nginx/monitoring.htpasswd;
    add_header Cache-Control "no-store" always;
    set $alertmanager_upstream http://ecommerce-alertmanager:9093;
    rewrite ^/admin/alertmanager/(.*)$ /$1 break;
    proxy_pass $alertmanager_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
# --- Everything else -> frontend (static) ---
location / {
    set $frontend_upstream http://frontend:80;
    proxy_pass $frontend_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
}
