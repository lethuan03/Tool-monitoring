# CHẾ ĐỘ HTTPS (chạy trên EC2 có domain + chứng chỉ Let's Encrypt).
# docker-compose.https.yml mount file này đè lên /etc/nginx/conf.d/default.conf.
# Cổng 80 chỉ còn 2 việc: trả file xác minh cho Let's Encrypt, và chuyển mọi
# request khác sang https://. Ứng dụng thật chỉ phục vụ ở cổng 443.
# Xem README mục 7.10.

include /etc/nginx/snippets/common-http.conf;

# --- Cổng 80: chỉ để xác minh domain + chuyển hướng sang HTTPS ---
server {
    listen 80;
    server_name _;
    access_log /dev/stdout json_access;

    include /etc/nginx/snippets/acme.conf;

    # 301 = chuyển hẳn. Trình duyệt gõ http://... sẽ tự nhảy sang https://...
    location / {
        return 301 https://$host$request_uri;
    }
}

# --- Cổng 443: ứng dụng thật, đã mã hoá ---
server {
    listen 443 ssl;
    http2 on;
    server_name _;
    access_log /dev/stdout json_access;

    # Certbot lưu cert theo tên "app" (tham số --cert-name app khi xin cert),
    # nên đường dẫn cố định, không phụ thuộc domain là gì.
    # fullchain = cert của bạn + cert trung gian; privkey = khoá bí mật (không bao giờ đưa lên git).
    ssl_certificate     /etc/letsencrypt/live/app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app/privkey.pem;

    # Chỉ cho phép TLS 1.2 và 1.3 (các bản cũ hơn đã bị coi là không an toàn)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HSTS: dặn trình duyệt "từ giờ chỉ vào trang này bằng HTTPS".
    # Để 1 ngày (86400 giây) cho an toàn lúc mới bật; chạy ổn rồi mới tăng lên
    # 1 năm (31536000), vì đặt dài mà HTTPS hỏng thì người dùng bị khoá ngoài.
    add_header Strict-Transport-Security "max-age=86400" always;

    include /etc/nginx/snippets/app-locations.conf;
}
