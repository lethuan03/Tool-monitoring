# Prometheus: pulls ("kéo") metrics from every target on the internal Docker network.
global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s

# Luật cảnh báo (mỗi 15s Prometheus chạy lại các luật này). Xem README mục 7.11.
rule_files:
  - /etc/prometheus/rules/*.yml

# Luật nào FIRING thì Prometheus đẩy sang Alertmanager để nhắn Telegram / gửi mail (README mục 7.14, 7.15)
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  # Prometheus itself
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Web app (Express) — exposes /metrics natively via prom-client
  - job_name: backend
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:3000"]

  # Nginx — via nginx-prometheus-exporter reading stub_status
  - job_name: nginx
    static_configs:
      - targets: ["nginx-exporter:9113"]

  # MySQL — via mysqld-exporter
  - job_name: mysql
    static_configs:
      - targets: ["mysqld-exporter:9104"]

  # Máy chủ (CPU, RAM, ổ đĩa) — via node-exporter
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  # Alertmanager — để luật TargetDown báo cả khi chính Alertmanager chết
  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]
