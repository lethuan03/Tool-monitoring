<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin — Nova Store</title>
  <!-- Giao diện dùng template Tabler v1.6.1 (MIT, https://tabler.io), lưu sẵn trong
       vendor/tabler/ để không phụ thuộc CDN. Chỉ dùng CSS, không dùng JS của Tabler. -->
  <link rel="stylesheet" href="vendor/tabler/tabler.min.css?v=1.6.1" />
  <!-- ?v=...: đổi số này mỗi lần sửa CSS/JS để trình duyệt tải bản mới thay vì dùng cache cũ -->
  <link rel="stylesheet" href="admin.css?v=20261016-1" />
</head>
<body data-bs-theme="dark">
  <!-- LƯU Ý: trang admin CHƯA có đăng nhập / phân quyền (để làm sau).
       Ai mở được trang này là thêm / sửa / xoá được sản phẩm. -->
  <div class="page">
    <!-- Sidebar -->
    <aside class="navbar navbar-vertical navbar-expand-lg" aria-label="Menu quản trị">
      <div class="container-fluid">
        <a href="#products" class="navbar-brand admin-brand">
          <span class="admin-brand-mark">◆</span> Nova<span class="text-cyan">Store</span>
          <span class="badge bg-primary-lt ms-2">Admin</span>
        </a>
        <div class="navbar-collapse" id="sidebar-menu">
          <ul class="navbar-nav pt-lg-3">
            <li class="nav-item">
              <a class="nav-link" href="#products" data-section="products">
                <span class="nav-link-icon" aria-hidden="true">📦</span>
                <span class="nav-link-title">Sản phẩm</span>
              </a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="#monitoring" data-section="monitoring">
                <span class="nav-link-icon" aria-hidden="true">📈</span>
                <span class="nav-link-title">Monitoring</span>
              </a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="/">
                <span class="nav-link-icon" aria-hidden="true">🏪</span>
                <span class="nav-link-title">Về cửa hàng</span>
              </a>
            </li>
          </ul>
        </div>
      </div>
    </aside>

    <div class="page-wrapper">
      <!-- ============ SẢN PHẨM ============ -->
      <section id="section-products" data-section-panel="products" aria-labelledby="products-title">
        <div class="page-header d-print-none">
          <div class="container-xl">
            <div class="row g-2 align-items-center">
              <div class="col">
                <div class="page-pretitle">Quản lý</div>
                <h2 class="page-title" id="products-title">Sản phẩm</h2>
              </div>
              <div class="col-auto ms-auto">
                <button type="button" class="btn btn-primary" id="addBtn">＋ Thêm sản phẩm</button>
              </div>
            </div>
          </div>
        </div>

        <div class="page-body">
          <div class="container-xl">
            <!-- Thông báo thành công / lỗi -->
            <div id="notice" role="status" aria-live="polite"></div>

            <!-- Thống kê nhanh (tính từ danh sách sản phẩm) -->
            <div class="row row-deck row-cards mb-3">
              <div class="col-6 col-lg-3">
                <div class="card card-sm"><div class="card-body">
                  <div class="subheader">Sản phẩm</div>
                  <div class="h1 mb-0" id="statCount">–</div>
                </div></div>
              </div>
              <div class="col-6 col-lg-3">
                <div class="card card-sm"><div class="card-body">
                  <div class="subheader">Tổng tồn kho</div>
                  <div class="h1 mb-0" id="statStock">–</div>
                </div></div>
              </div>
              <div class="col-6 col-lg-3">
                <div class="card card-sm"><div class="card-body">
                  <div class="subheader">Sắp hết (≤ 5)</div>
                  <div class="h1 mb-0 text-warning" id="statLow">–</div>
                </div></div>
              </div>
              <div class="col-6 col-lg-3">
                <div class="card card-sm"><div class="card-body">
                  <div class="subheader">Hết hàng</div>
                  <div class="h1 mb-0 text-danger" id="statOut">–</div>
                </div></div>
              </div>
            </div>

            <div class="card">
              <div class="card-header">
                <h3 class="card-title">Danh sách sản phẩm</h3>
                <div class="ms-auto">
                  <label class="visually-hidden" for="search">Tìm theo tên</label>
                  <input type="search" id="search" class="form-control form-control-sm" placeholder="Tìm theo tên…" />
                </div>
              </div>
              <div class="table-responsive">
                <table class="table card-table table-vcenter">
                  <thead>
                    <tr>
                      <th class="w-1">ID</th>
                      <th>Sản phẩm</th>
                      <th class="text-end">Giá</th>
                      <th class="text-end">Tồn kho</th>
                      <th class="w-1"><span class="visually-hidden">Thao tác</span></th>
                    </tr>
                  </thead>
                  <tbody id="productRows">
                    <tr><td colspan="5" class="text-secondary">Đang tải…</td></tr>
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        </div>
      </section>

      <!-- ============ MONITORING ============ -->
      <section id="section-monitoring" data-section-panel="monitoring" aria-labelledby="monitoring-title" hidden>
        <div class="page-header d-print-none">
          <div class="container-xl">
            <div class="page-pretitle">Hệ thống</div>
            <h2 class="page-title" id="monitoring-title">Tool monitoring</h2>
          </div>
        </div>
        <div class="page-body">
          <div class="container-xl">
            <!-- tools.js vẽ các ô tool vào đây (danh sách + cổng nằm trong TOOL_CONFIG) -->
            <div id="tools-root" class="tool-tiles"></div>
          </div>
        </div>
      </section>
    </div>
  </div>

  <!-- Hộp thoại thêm / sửa sản phẩm (dùng <dialog> có sẵn của trình duyệt) -->
  <dialog id="productDialog" class="admin-dialog" aria-labelledby="dialogTitle">
    <form id="productForm" class="modal-content" novalidate>
      <div class="modal-header">
        <h3 class="modal-title" id="dialogTitle">Thêm sản phẩm</h3>
        <button type="button" class="btn-close" data-close aria-label="Đóng"></button>
      </div>
      <div class="modal-body">
        <div id="formError" class="alert alert-danger d-none" role="alert"></div>

        <div class="mb-3">
          <label class="form-label required" for="fName">Tên sản phẩm</label>
          <input id="fName" name="name" class="form-control" maxlength="255" required />
        </div>
        <div class="row">
          <div class="col-sm-6 mb-3">
            <label class="form-label required" for="fPrice">Giá (₫)</label>
            <input id="fPrice" name="price" type="number" class="form-control" min="0" step="any" required />
          </div>
          <div class="col-sm-6 mb-3">
            <label class="form-label required" for="fStock">Tồn kho</label>
            <input id="fStock" name="stock" type="number" class="form-control" min="0" step="1" required />
          </div>
        </div>
        <div class="mb-3">
          <label class="form-label" for="fImage">Link ảnh (http/https)</label>
          <input id="fImage" name="image" type="url" class="form-control" maxlength="512" placeholder="https://…" />
          <img id="fImagePreview" class="admin-preview mt-2" alt="Xem trước ảnh" hidden />
        </div>
        <div class="mb-3">
          <label class="form-label" for="fDesc">Mô tả</label>
          <textarea id="fDesc" name="description" class="form-control" rows="3" maxlength="5000"></textarea>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-link link-secondary" data-close>Huỷ</button>
        <button type="submit" class="btn btn-primary ms-auto" id="saveBtn">Lưu</button>
      </div>
    </form>
  </dialog>

  <script src="tools.js?v=20261016-4"></script>
  <script src="admin.js?v=20261016-1"></script>
</body>
</html>
