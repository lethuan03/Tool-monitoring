# Rotate container logs so they can't fill the host disk
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  # ============ APPLICATION ============

  # 1) Database
  db:
    image: mysql:8.0.40
    container_name: ecommerce-db
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      - MYSQL_DATABASE=${MYSQL_DATABASE:?set MYSQL_DATABASE in .env}
      - MYSQL_USER=${MYSQL_USER:?set MYSQL_USER in .env}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
      - MYSQL_EXPORTER_PASSWORD=${MYSQL_EXPORTER_PASSWORD:?set MYSQL_EXPORTER_PASSWORD in .env}
    volumes:
      - ecommerce-db-data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_ROOT_PASSWORD\" mysqladmin ping -h localhost -uroot --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - appnet
    logging: *default-logging
    restart: unless-stopped

  # 2) Backend API (Express) — also exposes /metrics for Prometheus
  backend:
    build: ./backend
    container_name: ecommerce-backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - PORT=3000
      # debug | info | warn | error — xem backend/src/logger.js
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USER=${MYSQL_USER}
      - DB_PASSWORD=${MYSQL_PASSWORD}
      - DB_NAME=${MYSQL_DATABASE}
    networks:
      - appnet
    logging: *default-logging
    restart: unless-stopped

  # 3) Frontend (static files served by nginx)
  frontend:
    build: ./frontend
    container_name: ecommerce-frontend
    networks:
      - appnet
    logging: *default-logging
    restart: unless-stopped

  # 4) Edge reverse proxy (single public entry point)
  nginx:
    image: nginx:1.27-alpine
    container_name: ecommerce-nginx
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    ports:
      - "${HTTP_PORT:-8080}:80"   # public; port 8081 (stub_status) stays internal
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      # Phần cấu hình dùng chung cho chế độ HTTP (local) và HTTPS (EC2)
      - ./nginx/snippets:/etc/nginx/snippets:ro
      # Thư mục certbot ghi file xác minh domain (chỉ dùng khi xin cert trên EC2)
      - ./certbot/www:/var/www/certbot:ro
    networks:
      - appnet
    logging: *default-logging
    restart: unless-stopped

  # ============ MONITORING: METRICS ============

  # 5) Exporter for Nginx (reads stub_status -> Prometheus metrics)
  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.3.0
    container_name: ecommerce-nginx-exporter
    command:
      - --nginx.scrape-uri=http://nginx:8081/stub_status
    depends_on:
      - nginx
    networks:
      - appnet
    logging: *default-logging
    restart: unless-stopped

  # 6) Exporter for MySQL (least-privilege 'exporter' user, see mysql/init)
  mysqld-exporter:
    image: prom/mysqld-exporter:v0.15.1
    container_name: ecommerce-mysqld-exporter
    command:
      - --mysqld.address=db:3306
      - --mysqld.username=exporter
    environment:
      - MYSQLD_EXPORTER_PASSWORD=${MYSQL_EXPORTER_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - appnet
    logging: *default-logging
    restart: unless-stopped

  # 6b) node-exporter — số đo của chính MÁY CHỦ: CPU, RAM, ổ đĩa, mạng.
  # Các exporter khác chỉ đo từng ứng dụng; nếu máy hết RAM hay đầy ổ đĩa thì
  # MySQL/backend chết theo mà không ai báo trước. Trên EC2 nó đo chính con EC2.
  # Trên Docker Desktop (Windows) nó đo máy ảo Linux mà Docker chạy bên trong,
  # KHÔNG phải Windows, nên số liệu local chỉ để thử, đừng so với Task Manager.
  node-exporter:
    image: prom/node-exporter:v1.12.1
    container_name: ecommerce-node-exporter
    command:
      # Đọc /proc, /sys, ổ đĩa của máy chủ qua thư mục /host (mount ở dưới)
      - --path.rootfs=/host
    # Dùng chung "không gian tiến trình" với máy chủ để thấy số liệu thật của máy,
    # không phải của riêng container
    pid: host
    volumes:
      # Mount toàn bộ ổ đĩa máy chủ, CHỈ ĐỌC
      - /:/host:ro
    # Không mở cổng ra ngoài: Prometheus đọc qua mạng nội bộ node-exporter:9100
    networks:
      - appnet
    logging: *default-logging
    restart: unless-stopped

  # 7) Prometheus (pulls metrics from backend + exporters every 15s)
  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: ecommerce-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION_TIME:-15d}
      - --storage.tsdb.retention.size=${PROMETHEUS_RETENTION_SIZE:-5GB}
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # Luật cảnh báo (CPU, RAM, ổ đĩa, target chết, lỗi 5xx...)
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    ports:
      # Bound to loopback only: reach it on the server via SSH tunnel, never publicly
      - "127.0.0.1:9090:9090"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      - backend
      - nginx-exporter
      - mysqld-exporter
      - node-exporter
      - alertmanager
    networks:
      - appnet
    logging: *default-logging
    restart: unless-stopped

  # 7b) Alertmanager — nhận cảnh báo từ Prometheus, gom nhóm, gửi TELEGRAM và/hoặc MAIL.
  # Thông tin kênh gửi (TELEGRAM_*, SMTP_*) đặt trong .env. Xem README mục 7.14-7.15.
  alertmanager:
    image: prom/alertmanager:v0.34.1
    container_name: ecommerce-alertmanager
    # entrypoint.sh điền giá trị .env vào khuôn alertmanager.yml rồi mới chạy
    entrypoint: ["/bin/sh", "/etc/alertmanager/entrypoint.sh"]
    environment:
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_FROM=${SMTP_FROM:-}
      - SMTP_USERNAME=${SMTP_USERNAME:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_REQUIRE_TLS=${SMTP_REQUIRE_TLS:-true}
      - ALERT_EMAIL_TO=${ALERT_EMAIL_TO:-}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID:-}
      - TELEGRAM_API_URL=${TELEGRAM_API_URL:-https://api.telegram.org}
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./alertmanager/entrypoint.sh:/etc/alertmanager/entrypoint.sh:ro
      - ./alertmanager/templates:/etc/alertmanager/templates:ro
      - alertmanager-data:/alertmanager
    ports:
      # Giao diện xem cảnh báo đang gửi / tạm tắt (silence) — loopback only
      - "127.0.0.1:9093:9093"
    networks:
      - appnet
    logging: *default-logging
    restart: unless-stopped

  # (Chỉ để TEST) mailpit — hộp thư giả: bắt mọi mail gửi tới nó, xem trên web.
  # Không bật mặc định. Bật bằng: docker compose --profile mail-test up -d
  # rồi đặt SMTP_HOST=mailpit:1025, SMTP_REQUIRE_TLS=false trong .env.
  mailpit:
    image: axllent/mailpit:v1.31.5
    container_name: ecommerce-mailpit
    profiles: ["mail-test"]
    ports:
      - "127.0.0.1:8025:8025"   # web xem mail: http://localhost:8025
    networks:
      - appnet
    logging: *default-logging
    restart: unless-stopped

  # ============ MONITORING: LOGS ============

  # 8) Loki — lưu log (vai trò giống Prometheus nhưng cho log, hỏi bằng LogQL)
  loki:
    image: grafana/loki:3.7.6
    container_name: ecommerce-loki
    command:
      - -config.file=/etc/loki/loki-config.yml
      # Cho phép dùng ${BIẾN} trong file config (dùng cho retention)
      - -config.expand-env=true
    environment:
      # Compose tự điền mặc định 168h (7 ngày) nếu .env không đặt,
      # nên Loki luôn nhận được giá trị cụ thể
      - LOKI_RETENTION_PERIOD=${LOKI_RETENTION_PERIOD:-168h}
    volumes:
      - ./loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki-data:/loki
    # Không đặt healthcheck: image Loki là distroless, không có sh/wget/curl nên
    # mọi lệnh healthcheck đều fail và container bị báo "unhealthy" oan.
    # Kiểm tra bằng tay từ máy host: curl http://127.0.0.1:3100/ready
    ports:
      # Loopback only, giống Prometheus: chỉ để gỡ lỗi trên máy đó
      - "127.0.0.1:${LOKI_PORT:-3100}:3100"
    networks:
      - appnet
    logging: *default-logging
    restart: unless-stopped

  # 9) Alloy — đọc log của mọi container qua docker socket, parse, đẩy sang Loki
  alloy:
    image: grafana/alloy:v1.20.1
    container_name: ecommerce-alloy
    # Cần quyền root để đọc /var/run/docker.sock (socket thuộc root:docker).
    # LƯU Ý BẢO MẬT: ":ro" chỉ chặn ghi/xoá FILE socket, KHÔNG chặn lệnh gửi
    # qua socket. Ai điều khiển được container này là điều khiển được Docker
    # (tạo/xoá container, mount ổ đĩa host) = quyền root trên máy. Chấp nhận
    # được cho demo; lên production nên đặt docker-socket-proxy chỉ mở API đọc
    # (containers, events, logs) ở giữa. Xem README #31.
    user: root
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data
    # Cũng không có sh/wget/curl trong image -> không đặt healthcheck.
    # Kiểm tra bằng tay: curl http://127.0.0.1:12345/-/ready
    ports:
      # Giao diện gỡ lỗi của Alloy (xem pipeline, số dòng đã đọc) — loopback only
      - "127.0.0.1:${ALLOY_PORT:-12345}:12345"
    depends_on:
      # Chỉ cần Loki đã khởi động, không chờ "healthy": nếu Loki chưa sẵn sàng,
      # loki.write của Alloy tự thử lại (retry) nên không mất log.
      - loki
    networks:
      - appnet
    logging: *default-logging
    restart: unless-stopped

  # ============ MONITORING: DASHBOARD ============

  # 10) Grafana (asks Prometheus + Loki, draws auto-refreshing dashboards — stores nothing itself)
  grafana:
    image: grafana/grafana:11.3.0
    container_name: ecommerce-grafana
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
      - GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES=false
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/etc/grafana/dashboards/shop-overview.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      # Loopback only, same as Prometheus
      - "127.0.0.1:${GRAFANA_PORT:-3001}:3000"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      - prometheus
      - loki
    networks:
      - appnet
    logging: *default-logging
    restart: unless-stopped

networks:
  appnet:
    driver: bridge

volumes:
  ecommerce-db-data:
  prometheus-data:
  grafana-data:
  loki-data:
  alloy-data:
  alertmanager-data:
