# Rotate container logs so they can't fill the host disk
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  # ============ APPLICATION ============

  # 1) Database
  db:
    image: mysql:8.0.40
    container_name: ecommerce-db
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      - MYSQL_DATABASE=${MYSQL_DATABASE:?set MYSQL_DATABASE in .env}
      - MYSQL_USER=${MYSQL_USER:?set MYSQL_USER in .env}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
      - MYSQL_EXPORTER_PASSWORD=${MYSQL_EXPORTER_PASSWORD:?set MYSQL_EXPORTER_PASSWORD in .env}
    volumes:
      - ecommerce-db-data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_ROOT_PASSWORD\" mysqladmin ping -h localhost -uroot --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - appnet
    logging: *default-logging
    restart: unless-stopped

  # 2) Backend API (Express) — also exposes /metrics for Prometheus
  backend:
    build: ./backend
    container_name: ecommerce-backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - PORT=3000
      # debug | info | warn | error — xem backend/src/logger.js
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USER=${MYSQL_USER}
      - DB_PASSWORD=${MYSQL_PASSWORD}
      - DB_NAME=${MYSQL_DATABASE}
    networks:
      - appnet
    logging: *default-logging
    restart: unless-stopped

  # 3) Frontend (static files served by nginx)
  frontend:
    build: ./frontend
    container_name: ecommerce-frontend
    networks:
      - appnet
    logging: *default-logging
    restart: unless-stopped

  # 4) Edge reverse proxy (single public entry point)
  nginx:
    image: nginx:1.27-alpine
    container_name: ecommerce-nginx
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    ports:
      - "${HTTP_PORT:-8080}:80"   # public; port 8081 (stub_status) stays internal
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - appnet
    logging: *default-logging
    restart: unless-stopped

  # ============ MONITORING: METRICS ============

  # 5) Exporter for Nginx (reads stub_status -> Prometheus metrics)
  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.3.0
    container_name: ecommerce-nginx-exporter
    command:
      - --nginx.scrape-uri=http://nginx:8081/stub_status
    depends_on:
      - nginx
    networks:
      - appnet
    logging: *default-logging
    restart: unless-stopped

  # 6) Exporter for MySQL (least-privilege 'exporter' user, see mysql/init)
  mysqld-exporter:
    image: prom/mysqld-exporter:v0.15.1
    container_name: ecommerce-mysqld-exporter
    command:
      - --mysqld.address=db:3306
      - --mysqld.username=exporter
    environment:
      - MYSQLD_EXPORTER_PASSWORD=${MYSQL_EXPORTER_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - appnet
    logging: *default-logging
    restart: unless-stopped

  # 7) Prometheus (pulls metrics from backend + exporters every 15s)
  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: ecommerce-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION_TIME:-15d}
      - --storage.tsdb.retention.size=${PROMETHEUS_RETENTION_SIZE:-5GB}
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      # Bound to loopback only: reach it on the server via SSH tunnel, never publicly
      - "127.0.0.1:9090:9090"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      - backend
      - nginx-exporter
      - mysqld-exporter
    networks:
      - appnet
    logging: *default-logging
    restart: unless-stopped

  # ============ MONITORING: LOGS ============

  # 8) Loki — lưu log (vai trò giống Prometheus nhưng cho log, hỏi bằng LogQL)
  loki:
    image: grafana/loki:3.7.6
    container_name: ecommerce-loki
    command:
      - -config.file=/etc/loki/loki-config.yml
      # Cho phép dùng ${BIẾN} trong file config (dùng cho retention)
      - -config.expand-env=true
    environment:
      # Compose tự điền mặc định 168h (7 ngày) nếu .env không đặt,
      # nên Loki luôn nhận được giá trị cụ thể
      - LOKI_RETENTION_PERIOD=${LOKI_RETENTION_PERIOD:-168h}
    volumes:
      - ./loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - loki-data:/loki
    # Không đặt healthcheck: image Loki là distroless, không có sh/wget/curl nên
    # mọi lệnh healthcheck đều fail và container bị báo "unhealthy" oan.
    # Kiểm tra bằng tay từ máy host: curl http://127.0.0.1:3100/ready
    ports:
      # Loopback only, giống Prometheus: chỉ để gỡ lỗi trên máy đó
      - "127.0.0.1:${LOKI_PORT:-3100}:3100"
    networks:
      - appnet
    logging: *default-logging
    restart: unless-stopped

  # 9) Alloy — đọc log của mọi container qua docker socket, parse, đẩy sang Loki
  alloy:
    image: grafana/alloy:v1.20.1
    container_name: ecommerce-alloy
    # Cần quyền root để đọc /var/run/docker.sock (socket thuộc root:docker).
    # Socket được mount READ-ONLY để Alloy chỉ đọc được, không điều khiển Docker.
    user: root
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - /etc/alloy/config.alloy
    volumes:
      - ./alloy/config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - alloy-data:/var/lib/alloy/data
    # Cũng không có sh/wget/curl trong image -> không đặt healthcheck.
    # Kiểm tra bằng tay: curl http://127.0.0.1:12345/-/ready
    ports:
      # Giao diện gỡ lỗi của Alloy (xem pipeline, số dòng đã đọc) — loopback only
      - "127.0.0.1:${ALLOY_PORT:-12345}:12345"
    depends_on:
      # Chỉ cần Loki đã khởi động, không chờ "healthy": nếu Loki chưa sẵn sàng,
      # loki.write của Alloy tự thử lại (retry) nên không mất log.
      - loki
    networks:
      - appnet
    logging: *default-logging
    restart: unless-stopped

  # ============ MONITORING: DASHBOARD ============

  # 10) Grafana (asks Prometheus + Loki, draws auto-refreshing dashboards — stores nothing itself)
  grafana:
    image: grafana/grafana:11.3.0
    container_name: ecommerce-grafana
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
      - GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES=false
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/etc/grafana/dashboards/shop-overview.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      # Loopback only, same as Prometheus
      - "127.0.0.1:${GRAFANA_PORT:-3001}:3000"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      - prometheus
      - loki
    networks:
      - appnet
    logging: *default-logging
    restart: unless-stopped

networks:
  appnet:
    driver: bridge

volumes:
  ecommerce-db-data:
  prometheus-data:
  grafana-data:
  loki-data:
  alloy-data:
