# Rotate container logs so they can't fill the host disk
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  # ============ APPLICATION ============

  # 1) Database
  db:
    image: mysql:8.0.40
    container_name: ecommerce-db
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      - MYSQL_DATABASE=${MYSQL_DATABASE:?set MYSQL_DATABASE in .env}
      - MYSQL_USER=${MYSQL_USER:?set MYSQL_USER in .env}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}
      - MYSQL_EXPORTER_PASSWORD=${MYSQL_EXPORTER_PASSWORD:?set MYSQL_EXPORTER_PASSWORD in .env}
    volumes:
      - ecommerce-db-data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_ROOT_PASSWORD\" mysqladmin ping -h localhost -uroot --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - appnet
    logging: *default-logging
    restart: unless-stopped

  # 2) Backend API (Express) — also exposes /metrics for Prometheus
  backend:
    build: ./backend
    container_name: ecommerce-backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USER=${MYSQL_USER}
      - DB_PASSWORD=${MYSQL_PASSWORD}
      - DB_NAME=${MYSQL_DATABASE}
    networks:
      - appnet
    logging: *default-logging
    restart: unless-stopped

  # 3) Frontend (static files served by nginx)
  frontend:
    build: ./frontend
    container_name: ecommerce-frontend
    networks:
      - appnet
    logging: *default-logging
    restart: unless-stopped

  # 4) Edge reverse proxy (single public entry point)
  nginx:
    image: nginx:1.27-alpine
    container_name: ecommerce-nginx
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    ports:
      - "${HTTP_PORT:-8080}:80"   # public; port 8081 (stub_status) stays internal
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - appnet
    logging: *default-logging
    restart: unless-stopped

  # ============ MONITORING: METRICS ============

  # 5) Exporter for Nginx (reads stub_status -> Prometheus metrics)
  nginx-exporter:
    image: nginx/nginx-prometheus-exporter:1.3.0
    container_name: ecommerce-nginx-exporter
    command:
      - --nginx.scrape-uri=http://nginx:8081/stub_status
    depends_on:
      - nginx
    networks:
      - appnet
    logging: *default-logging
    restart: unless-stopped

  # 6) Exporter for MySQL (least-privilege 'exporter' user, see mysql/init)
  mysqld-exporter:
    image: prom/mysqld-exporter:v0.15.1
    container_name: ecommerce-mysqld-exporter
    command:
      - --mysqld.address=db:3306
      - --mysqld.username=exporter
    environment:
      - MYSQLD_EXPORTER_PASSWORD=${MYSQL_EXPORTER_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - appnet
    logging: *default-logging
    restart: unless-stopped

  # 7) Prometheus (pulls metrics from backend + exporters every 15s)
  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: ecommerce-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION_TIME:-15d}
      - --storage.tsdb.retention.size=${PROMETHEUS_RETENTION_SIZE:-5GB}
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      # Bound to loopback only: reach it on the server via SSH tunnel, never publicly
      - "127.0.0.1:9090:9090"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      - backend
      - nginx-exporter
      - mysqld-exporter
    networks:
      - appnet
    logging: *default-logging
    restart: unless-stopped

  # ============ MONITORING: DASHBOARD ============

  # 8) Grafana (asks Prometheus, draws auto-refreshing dashboards — stores no metrics itself)
  grafana:
    image: grafana/grafana:11.3.0
    container_name: ecommerce-grafana
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_ANALYTICS_REPORTING_ENABLED=false
      - GF_ANALYTICS_CHECK_FOR_UPDATES=false
      - GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES=false
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/etc/grafana/dashboards/shop-overview.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      # Loopback only, same as Prometheus
      - "127.0.0.1:${GRAFANA_PORT:-3001}:3000"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    depends_on:
      - prometheus
    networks:
      - appnet
    logging: *default-logging
    restart: unless-stopped

networks:
  appnet:
    driver: bridge

volumes:
  ecommerce-db-data:
  prometheus-data:
  grafana-data:
