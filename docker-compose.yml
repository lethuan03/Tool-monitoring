services:
  # 1) Database
  db:
    image: mysql:8.0
    container_name: ecommerce-db
    environment:
      - MYSQL_ROOT_PASSWORD=root
      - MYSQL_DATABASE=ecommerce
      - MYSQL_USER=shop
      - MYSQL_PASSWORD=shoppass
    volumes:
      - ecommerce-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - appnet
    restart: unless-stopped

  # 2) Backend API (Express)
  backend:
    build: ./backend
    container_name: ecommerce-backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DB_HOST=db
      - DB_PORT=3306
      - DB_USER=shop
      - DB_PASSWORD=shoppass
      - DB_NAME=ecommerce
    networks:
      - appnet
    restart: unless-stopped

  # 3) Frontend (static files served by nginx)
  frontend:
    build: ./frontend
    container_name: ecommerce-frontend
    networks:
      - appnet
    restart: unless-stopped

  # 4) Edge reverse proxy (single public entry point)
  nginx:
    image: nginx:alpine
    container_name: ecommerce-nginx
    depends_on:
      - backend
      - frontend
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - appnet
    restart: unless-stopped

networks:
  appnet:
    driver: bridge

volumes:
  ecommerce-db-data:
